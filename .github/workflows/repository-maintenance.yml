name: Organize repository branches

on:
  push:
    branches: [main]
    paths: [".github/workflows/repository-maintenance.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-superseded-branches:
    if: github.repository == 'w3b-code/ayugram'
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical branches and remove included fix branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ios = await github.rest.git.getRef({ owner, repo, ref: 'heads/ios' });
            await github.rest.git.getRef({ owner, repo, ref: 'heads/desktop' });
            const expected = {
              'fix/ghost-offline-status': '12c22b99620eee7ebeb2e9c2a59ebbcaf3f30c94',
              'fix/notification-app-group': '47257d335205913a24cb21cdf33f742527d2cb45'
            };
            for (const [branch, sha] of Object.entries(expected)) {
              let current;
              try {
                current = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (current.data.object.sha !== sha) {
                throw new Error('Branch changed; preserving ' + branch);
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: sha + '...' + ios.data.object.sha
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                throw new Error('Commits are not included in ios; preserving ' + branch);
              }
              const latest = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
              if (latest.data.object.sha !== sha) {
                throw new Error('Branch changed during verification; preserving ' + branch);
              }
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
              core.info('Removed included branch ' + branch);
            }
