name: Build AyuGram Windows

on:
  workflow_dispatch:
  push:
    branches: [desktop]
    paths:
      - "tdesktop"
      - "desktop.json"
      - "scripts/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: ayugram-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Checkout Windows source
        uses: actions/checkout@v4
        with:
          ref: desktop
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
          sdk: "10.0.26100.0"

      - name: Validate source and API configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if (!$env:TELEGRAM_API_ID -or !$env:TELEGRAM_API_HASH) {
            throw 'Set repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH.'
          }
          ./scripts/build.ps1 -Stage Validate
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore native libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: windows-v143-${{ hashFiles('desktop.json') }}-v1

      - name: Prepare native libraries
        id: prepare
        run: ./scripts/build.ps1 -Stage Prepare

      - name: Save prepared libraries
        if: steps.prepare.outcome == 'success' && steps.libraries.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: windows-v143-${{ hashFiles('desktop.json') }}-v1

      - name: Build AyuGram x64
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./scripts/build.ps1 -Stage Build

      - name: Package EXE and checksums
        run: ./scripts/build.ps1 -Stage Package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
