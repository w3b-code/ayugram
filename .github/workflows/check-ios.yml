name: Check iOS

on:
  push:
    branches: [ios]
    paths:
      - "scripts/**"
      - "runtime/**"
      - "tests/**"
      - ".github/workflows/check-ios.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test App Group configuration
        run: python3 -m unittest discover -s tests
      - name: Test data migration
        run: |
          swiftc runtime/AyuAppGroupMigration.swift tests/AppGroupMigrationTests.swift -o "$RUNNER_TEMP/app-group-tests"
          "$RUNNER_TEMP/app-group-tests"
      - name: Test notification payload fallback and safe diagnostics
        run: |
          swiftc -warnings-as-errors runtime/AyuNotificationDiagnostics.swift tests/NotificationDiagnosticsTests.swift -o "$RUNNER_TEMP/notification-tests"
          "$RUNNER_TEMP/notification-tests"
